    let currentCat = 'all';
    let currentSubCat = null;
    let searchQuery = '';

    function selectCat(cat) {
      currentCat = cat;
      currentSubCat = null;
      document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelector('[data-cat="' + cat + '"]').classList.add('active');
      renderProducts();
    }

    function selectSubCat(sub) {
      currentSubCat = currentSubCat === sub ? null : sub;
      renderProducts();
    }

    function handleSearch(q) {
      searchQuery = q.trim().toLowerCase();
      renderProducts();
    }

    function scrollNav(dir) {
      document.getElementById('navTrack').scrollBy({ left: dir * 200, behavior: 'smooth' });
    }

    function getFilteredProducts() {
      return PRODUCTS.filter(function(p) {
        if (currentCat !== 'all' && p.category !== currentCat) return false;
        if (searchQuery) {
          var s = searchQuery;
          if (!p.model.toLowerCase().includes(s) && !p.name.toLowerCase().includes(s)) return false;
        }
        return true;
      });
    }

    function getSubCatProducts(subCatKey, productList) {
      var models = CATEGORY_DATA[currentCat] && CATEGORY_DATA[currentCat][subCatKey];
      if (!models) return [];
      var modelSet = {};
      models.forEach(function(m) { modelSet[m] = true; });
      return productList.filter(function(p) { return modelSet[p.model]; });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderProducts() {
      var container = document.getElementById('productContainer');
      var filtered = getFilteredProducts();
      var count = document.getElementById('resultsCount');
      var noResults = document.getElementById('noResults');

      if (filtered.length === 0) {
        container.innerHTML = '';
        count.textContent = '';
        noResults.style.display = 'flex';
        return;
      }
      noResults.style.display = 'none';

      var html = '';

      if (currentCat === 'all') {
        var byCat = {};
        filtered.forEach(function(p) {
          if (!byCat[p.cat_name]) byCat[p.cat_name] = [];
          byCat[p.cat_name].push(p);
        });
        for (var catName in byCat) {
          var items = byCat[catName];
          html += '<div class="cat-section"><h2 class="cat-title">' + escapeHtml(catName) + ' <span class="cat-count">(' + items.length + ')</span></h2><div class="products-grid">';
          items.forEach(function(p) { html += renderCard(p); });
          html += '</div></div>';
        }
        count.textContent = '共 ' + filtered.length + ' 款产品';
      } else {
        var subCats = CATEGORY_DATA[currentCat];
        if (!subCats) {
          html += '<div class="products-grid">';
          filtered.forEach(function(p) { html += renderCard(p); });
          html += '</div>';
          count.textContent = '共 ' + filtered.length + ' 款产品';
        } else {
          html += '<div class="sub-cat-list">';
          for (var subName in subCats) {
            var subProds = getSubCatProducts(subName, filtered);
            if (subProds.length === 0 && searchQuery) continue;
            var isActive = currentSubCat === subName;
            html += '<div class="sub-cat-item' + (isActive ? ' active' : '') + '">';
            html += '<button class="sub-cat-btn" onclick="selectSubCat(\'' + subName.replace(/'/g, '\'') + '\')">' + escapeHtml(subName) + ' <span class="sub-count">' + subProds.length + '</span><span class="sub-arrow">' + (isActive ? '▼' : '▶') + '</span></button>';
            html += '<div class="sub-cat-content"' + (isActive ? '' : ' style="display:none"') + '>';
            if (subProds.length === 0) {
              html += '<p class="no-prods">该分类下暂无相关产品</p>';
            } else {
              html += '<div class="products-grid">';
              subProds.forEach(function(p) { html += renderCard(p); });
              html += '</div>';
            }
            html += '</div></div>';
          }
          html += '</div>';
          count.textContent = '共 ' + filtered.length + ' 款产品';
        }
      }

      container.innerHTML = html;
    }

    function renderCard(p) {
      var model = p.model;
      var name = p.name;
      var doc = p.docs && p.docs[0] ? p.docs[0] : '';
      var docUrl = '#';
      if (doc) {
        var pdfUrl = doc.replace(/.docx?$/, '.pdf');
        docUrl = 'https://truir-eng.github.io/gztruit/' + pdfUrl;
      }
      var desc = window.__PRODUCT_DESCRIPTIONS__ && window.__PRODUCT_DESCRIPTIONS__[model];
      var descText = desc && desc.zh ? desc.zh : '';
      var detailUrl = 'product.html?model=' + encodeURIComponent(model);
      return '<div class="product-card"><h3 class="product-model">' + escapeHtml(model) + '</h3><p class="product-name">' + escapeHtml(name) + '</p>' + (descText ? '<p class="product-desc">' + escapeHtml(descText) + '</p>' : '') + '<div class="product-actions"><a href="' + detailUrl + '" class="btn-detail">查看详情</a><a href="' + docUrl + '" class="btn-doc" target="_blank">下载资料</a></div></div>';
    }

    document.addEventListener('DOMContentLoaded', renderProducts);
  </script>
