    function renderProducts(filtered) {
      var grid = document.getElementById('productsGrid');
      var countEl = document.getElementById('resultsCount');
      grid.innerHTML = '';
      countEl.innerHTML = '<span style="color:#666;font-size:0.85rem;">全 <strong>' + filtered.length + '</strong> 製品</span>';
      document.getElementById('noResults').style.display = filtered.length === 0 ? 'flex' : 'none';
      filtered.forEach(function(p) {
        var card = document.createElement('a');
        card.href = 'product.html?model=' + encodeURIComponent(p.model);
        card.className = 'product-card';
        card.innerHTML = '<div class="product-model">' + p.model + '</div>' +
          '<div class="product-name">' + p.name + '</div>' +
          '<div class="product-cat">' + p.cat_name + '</div>';
        grid.appendChild(card);
      });
    }

    function handleSearch(q) {
      q = q.toLowerCase().trim();
      var filtered = q ? products.filter(function(p) {
        return p.name.toLowerCase().indexOf(q) !== -1 ||
               p.model.toLowerCase().indexOf(q) !== -1 ||
               p.cat_name.toLowerCase().indexOf(q) !== -1 ||
               (p.name_en && p.name_en.toLowerCase().indexOf(q) !== -1);
      }) : products;
      renderProducts(filtered);
    }

    function handleCategoryChange(cat) {
      var filtered = cat === 'all' ? products : products.filter(function(p) { return p.category === cat; });
      renderProducts(filtered);
    }

    document.getElementById('searchInput').addEventListener('keyup', function(e) { if (e.key === 'Enter') handleSearch(this.value); });
    renderProducts(products);
  </script>
