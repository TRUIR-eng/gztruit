    function renderProducts(filtered) {
      const grid = document.getElementById('productsGrid');
      const resultsCount = document.getElementById('resultsCount');
      grid.innerHTML = '';
      resultsCount.innerHTML = '';
      document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';
      if (filtered.length === 0) return;
      resultsCount.innerHTML = '<span style="color:#666;font-size:0.85rem;">총 <strong style="color:#005A9C">' + filtered.length + '</strong>개 제품</span>';
      filtered.forEach(function(p) {
        const card = document.createElement('a');
        card.href = 'product.html?model=' + encodeURIComponent(p.model);
        card.className = 'product-card';
        card.innerHTML = '<div style="font-size:0.72rem;background:#E8F4FF;color:#005A9C;padding:0.2rem 0.5rem;border-radius:4px;display:inline-block;margin-bottom:0.4rem;">' + p.model + '</div>' +
          '<div style="font-weight:700;color:#222;font-size:0.95rem;margin-bottom:0.3rem;">' + p.name + '</div>' +
          '<div style="font-size:0.78rem;color:#888;">' + p.cat_name + '</div>';
        grid.appendChild(card);
      });
    }

    function handleSearch(q) {
      q = q.toLowerCase().trim();
      const filtered = q ? products.filter(function(p) {
        return p.model.toLowerCase().indexOf(q) !== -1 ||
          p.name.toLowerCase().indexOf(q) !== -1 ||
          p.name_en.toLowerCase().indexOf(q) !== -1 ||
          p.keywords_en.toLowerCase().indexOf(q) !== -1;
      }) : products;
      renderProducts(filtered);
    }

    function handleCategoryChange(cat) {
      const filtered = cat === 'all' ? products : products.filter(function(p) { return p.category === cat; });
      renderProducts(filtered);
    }

    document.getElementById('searchInput').addEventListener('keyup', function(e) { if (e.key === 'Enter') handleSearch(this.value); });
    renderProducts(products);
  </script>
